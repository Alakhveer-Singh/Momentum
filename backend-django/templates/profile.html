{% extends "base.html" %}
{% block content %}
<div class="mx-auto max-w-lg space-y-4">
  <h1 class="text-xl font-bold">My Profile</h1>
  <form id="profileForm" class="space-y-3 rounded-xl border border-slate-200 bg-white p-5">
    <div><label class="mb-1 block text-sm font-medium">Name</label><input id="p_name" value="{{ me.name }}" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" /></div>
    <div><label class="mb-1 block text-sm font-medium">Email</label><input value="{{ me.email }}" disabled class="w-full rounded-lg border border-slate-300 bg-slate-50 px-3 py-2 text-sm" /></div>
    <div><label class="mb-1 block text-sm font-medium">Phone</label><input id="p_phone" value="{{ me.phone }}" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" /></div>
    <hr class="border-slate-100" />
    <div class="text-sm font-semibold">Change password</div>
    <input id="p_current" type="password" placeholder="Current password" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
    <input id="p_new" type="password" placeholder="New password (min 8)" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
    <input id="p_confirm" type="password" placeholder="Confirm new password" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
    <div id="p_msg" class="hidden rounded-lg bg-emerald-50 px-3 py-2 text-sm text-emerald-700"></div>
    <div id="p_error" class="hidden rounded-lg bg-red-50 px-3 py-2 text-sm text-red-600"></div>
    <button class="w-full rounded-lg bg-indigo-600 py-2.5 text-sm font-semibold text-white hover:bg-indigo-700">Save changes</button>
  </form>
</div>
{% endblock %}
{% block page_js %}
<script>
  const $ = (id) => document.getElementById(id);
  $("profileForm").addEventListener("submit", async (e) => {
    e.preventDefault(); $("p_msg").classList.add("hidden"); $("p_error").classList.add("hidden");
    const body = { name: $("p_name").value, phone: $("p_phone").value || null };
    if ($("p_new").value) { body.password = $("p_new").value; body.password_confirmation = $("p_confirm").value; body.current_password = $("p_current").value; }
    try {
      await api("auth/profile", { method: "PUT", body });
      $("p_msg").textContent = "Profile updated."; $("p_msg").classList.remove("hidden");
      ["p_current","p_new","p_confirm"].forEach((k) => ($(k).value = ""));
    } catch (err) { $("p_error").textContent = err.data?.message || "Update failed."; $("p_error").classList.remove("hidden"); }
  });
</script>
{% endblock %}
