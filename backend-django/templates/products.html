{% extends "base.html" %}
{% block content %}
<div class="max-w-xl space-y-2">
  <div class="mb-6">
    <h1 class="text-xl font-bold">Products &amp; Services</h1>
    <p class="mt-1 text-sm text-slate-500">Manage the products and services a lead can be interested in.</p>
  </div>

  <div class="mb-6">
    <div class="mb-2 flex items-center gap-2">
      <div class="flex flex-col gap-0.5"><span class="h-1 w-5 rounded bg-slate-400"></span><span class="h-1 w-5 rounded bg-slate-400"></span><span class="h-1 w-3 rounded bg-slate-400"></span></div>
      <span class="text-sm font-semibold text-slate-600">Catalogue</span>
    </div>
    <div id="prodList">
      {% for p in products %}
      <div class="prod-row flex items-center gap-3 border-b border-slate-100 py-3 text-sm" draggable="true" data-id="{{ p.id }}">
        <i data-lucide="grip-vertical" class="h-4 w-4 shrink-0 cursor-grab text-slate-300"></i>
        <button type="button" class="color-dot" style="background:{{ p.color }};" data-color="{{ p.color }}" title="Change color" onclick="event.stopPropagation(); openColorPicker(this, this.dataset.color, (c) => setProductColor({{ p.id }}, c, this))"></button>
        <span class="name flex-1 text-slate-900">{{ p.name }}</span>
        {% if p.label %}<span class="kind rounded-full px-2 py-0.5 text-xs font-medium text-slate-500">{{ p.label }}</span>{% endif %}
        <div class="flex items-center gap-1">
          <button onclick="renameProduct({{ p.id }}, this)" class="rounded p-1 text-slate-400 hover:bg-slate-100"><i data-lucide="pencil" class="h-3.5 w-3.5"></i></button>
          <button onclick="deleteProduct({{ p.id }}, '{{ p.name|escapejs }}')" class="rounded p-1 text-slate-400 hover:bg-red-50 hover:text-red-500"><i data-lucide="x" class="h-3.5 w-3.5"></i></button>
        </div>
      </div>
      {% endfor %}
    </div>
    <button onclick="addProduct()" class="mt-2 inline-flex items-center gap-1.5 rounded-lg px-3 py-2 text-sm text-slate-900 hover:bg-slate-100"><i data-lucide="plus" class="h-4 w-4"></i> Add product / service</button>
  </div>
</div>
{% endblock %}
{% block page_js %}
<script>
  async function renameProduct(id, btn) {
    const row = btn.closest(".prod-row");
    const span = row.querySelector(".name");
    const name = await uiPrompt("Rename", { label: "Name", value: span.textContent.trim() });
    if (!name || name === span.textContent.trim()) return;
    try {
      const res = await api(`products/${id}`, { method: "PATCH", body: { name } });
      span.textContent = res.name;
    } catch (err) { uiAlert(err.data?.detail || "Rename failed.", { type: "error" }); }
  }

  async function setProductColor(id, color, dot) {
    dot.style.background = color;
    dot.dataset.color = color;
    try {
      await api(`products/${id}`, { method: "PATCH", body: { color } });
    } catch (err) { uiAlert(err.data?.detail || "Could not update color.", { type: "error" }); }
  }

  async function deleteProduct(id, name) {
    if (!await uiConfirm("Delete item", `"${name}" will be removed. This cannot be undone.`)) return;
    try {
      await api(`products/${id}/delete`, { method: "DELETE" });
      location.reload();
    } catch (err) { uiAlert(err.data?.detail || "Delete failed.", { type: "error" }); }
  }

  async function addProduct() {
    const res = await uiForm({
      title: "Add product / service",
      fields: [
        { name: "name", label: "Name", placeholder: "e.g. UI/UX Design Course", required: true },
        { name: "label", label: "Label", placeholder: "e.g. Bestseller", required: false },
      ],
      confirmText: "Add",
    });
    if (!res) return;
    try {
      await api("products/create", { method: "POST", body: { name: res.name, label: res.label } });
      location.reload();
    } catch (err) { uiAlert(err.data?.detail || "Failed to add.", { type: "error" }); }
  }

  // Drag reorder
  let dragId = null;
  const list = document.getElementById("prodList");
  list.querySelectorAll(".prod-row").forEach((row) => {
    row.addEventListener("dragstart", () => { dragId = row.dataset.id; row.classList.add("opacity-40"); });
    row.addEventListener("dragend", () => row.classList.remove("opacity-40"));
    row.addEventListener("dragover", (e) => e.preventDefault());
    row.addEventListener("drop", async () => {
      const dragging = list.querySelector(`.prod-row[data-id="${dragId}"]`);
      if (!dragging || dragging === row) return;
      list.insertBefore(dragging, row);
      const ids = [...list.querySelectorAll(".prod-row")].map((r) => Number(r.dataset.id));
      await api("products/reorder", { method: "POST", body: { ids } });
      dragId = null;
    });
  });
</script>
{% endblock %}
