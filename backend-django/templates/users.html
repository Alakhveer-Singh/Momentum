{% extends "base.html" %}
{% block content %}
<div class="space-y-4">
  <div class="flex items-center justify-between">
    <h1 class="text-xl font-bold">Team &amp; Roles</h1>
    <button onclick="openUser()" class="inline-flex items-center gap-1.5 rounded-lg bg-slate-900 px-3 py-2 text-sm font-semibold text-white hover:bg-slate-800"><i data-lucide="plus" class="h-4 w-4"></i> Add User</button>
  </div>

  <form id="userForm" class="hidden flex flex-wrap gap-3 rounded-xl border border-slate-200 bg-white p-4">
    <input type="hidden" id="u_id" />
    <input id="u_name" required placeholder="Name *" class="rounded-lg border border-slate-300 px-3 py-2 text-sm" />
    <input id="u_email" type="email" placeholder="Email *" class="rounded-lg border border-slate-300 px-3 py-2 text-sm" />
    <input id="u_password" type="password" placeholder="Password (min 8)" class="rounded-lg border border-slate-300 px-3 py-2 text-sm" />
    <select id="u_role" class="rounded-lg border border-slate-300 px-3 py-2 text-sm"><option value="rep">Telecaller</option><option value="manager">Manager</option><option value="admin">Admin</option></select>
    <input id="u_phone" placeholder="Phone" class="rounded-lg border border-slate-300 px-3 py-2 text-sm" />
    <button class="rounded-lg bg-slate-900 px-4 py-2 text-sm font-semibold text-white">Save</button>
    <button type="button" onclick="document.getElementById('userForm').classList.add('hidden')" class="rounded-lg border border-slate-300 px-4 py-2 text-sm">Cancel</button>
    <div id="u_error" class="hidden w-full rounded-lg bg-red-50 px-3 py-2 text-sm text-red-600"></div>
  </form>

  <div class="overflow-x-auto rounded-xl border border-slate-200 bg-white">
    <table class="w-full text-sm">
      <thead class="bg-slate-50 text-left text-xs uppercase tracking-wide text-slate-400">
        <tr><th class="px-4 py-3">User</th><th class="px-4 py-3">Role</th><th class="hidden px-4 py-3 md:table-cell">Leads</th><th class="hidden px-4 py-3 md:table-cell">Tasks</th><th class="px-4 py-3">Status</th><th class="px-4 py-3 text-right">Actions</th></tr>
      </thead>
      <tbody>
        {% for u in users %}
        <tr class="border-t border-slate-100">
          <td class="px-4 py-3"><div class="font-medium">{{ u.name }}</div><div class="text-xs text-slate-400">{{ u.email }}</div></td>
          <td class="px-4 py-3"><span class="rounded-full px-2 py-0.5 text-xs font-medium capitalize {% if u.role == 'admin' %}bg-slate-200 text-slate-700{% elif u.role == 'manager' %}bg-slate-200 text-slate-700{% else %}bg-slate-100 text-slate-600{% endif %}">{{ u.role }}</span></td>
          <td class="hidden px-4 py-3 md:table-cell">{{ u.leads_count }}</td>
          <td class="hidden px-4 py-3 md:table-cell">{{ u.tasks_count }}</td>
          <td class="px-4 py-3"><button onclick="toggleActive({{ u.id }}, {{ u.is_active|yesno:'true,false' }})" class="rounded-full px-2 py-0.5 text-xs font-medium {% if u.is_active %}bg-slate-200 text-slate-800{% else %}bg-red-100 text-red-700{% endif %}">{{ u.is_active|yesno:"Active,Inactive" }}</button></td>
          <td class="px-4 py-3 text-right">
            <button onclick="openUser({{ u.id }})" data-id="{{ u.id }}" data-name="{{ u.name }}" data-email="{{ u.email }}" data-role="{{ u.role }}" data-phone="{{ u.phone }}" class="u-edit rounded p-1.5 text-slate-500 hover:bg-slate-100" title="Edit"><i data-lucide="pencil" class="h-4 w-4"></i></button>
            <button onclick="delUser({{ u.id }}, '{{ u.name|escapejs }}')" class="rounded p-1.5 text-red-500 hover:bg-red-50" title="Delete"><i data-lucide="trash-2" class="h-4 w-4"></i></button>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
{% block page_js %}
<script>
  const $ = (id) => document.getElementById(id);
  function openUser(id) {
    $("userForm").classList.remove("hidden"); $("u_error").classList.add("hidden");
    if (id) {
      const b = document.querySelector(`.u-edit[data-id="${id}"]`);
      $("u_id").value = id; $("u_name").value = b.dataset.name; $("u_email").value = b.dataset.email;
      $("u_role").value = b.dataset.role; $("u_phone").value = b.dataset.phone; $("u_password").value = "";
    } else { ["u_id","u_name","u_email","u_password","u_phone"].forEach((k) => ($(k).value = "")); $("u_role").value = "rep"; }
  }
  $("userForm").addEventListener("submit", async (e) => {
    e.preventDefault(); $("u_error").classList.add("hidden");
    const body = { name: $("u_name").value, email: $("u_email").value, role: $("u_role").value, phone: $("u_phone").value };
    if ($("u_password").value) body.password = $("u_password").value;
    const id = $("u_id").value;
    try {
      if (id) await api(`users/${id}`, { method: "PUT", body });
      else await api("users", { method: "POST", body });
      location.reload();
    } catch (err) { $("u_error").textContent = err.data?.message || "Save failed."; $("u_error").classList.remove("hidden"); }
  });
  async function toggleActive(id, active) {
    try { await api(`users/${id}`, { method: "PATCH", body: { is_active: !active } }); location.reload(); }
    catch (err) { uiAlert(err.data?.message || "Update failed.", { type: "error" }); }
  }
  async function delUser(id, name) {
    if (!await uiConfirm("Delete user?", `Delete user ${name}? Their leads will be unassigned.`, { confirmText: "Delete", danger: true })) return;
    try { await api(`users/${id}`, { method: "DELETE" }); location.reload(); }
    catch (err) { uiAlert(err.data?.message || "Delete failed.", { type: "error" }); }
  }
</script>
{% endblock %}
