<div id="uiModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 p-4">
  <div id="uiModalCard" class="w-full max-w-md rounded-2xl bg-white p-6 shadow-2xl" style="transform:scale(.96);opacity:0;transition:transform .15s ease,opacity .15s ease;" onclick="event.stopPropagation()">
    <div class="mb-1 flex items-start gap-3">
      <div id="uiModalIcon" class="hidden h-10 w-10 flex-shrink-0 items-center justify-center rounded-full"></div>
      <div class="flex-1">
        <h3 id="uiModalTitle" class="text-lg font-bold text-slate-800"></h3>
        <p id="uiModalMsg" class="mt-1 hidden text-sm text-slate-500"></p>
      </div>
    </div>
    <div id="uiModalBody" class="mt-4 space-y-3"></div>
    <div id="uiModalError" class="mt-3 hidden rounded-lg bg-red-50 px-3 py-2 text-sm text-red-600"></div>
    <div class="mt-6 flex justify-end gap-2">
      <button type="button" id="uiModalCancel" class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium hover:bg-slate-50">Cancel</button>
      <button type="button" id="uiModalConfirm" class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-700">Save</button>
    </div>
  </div>
</div>
<script>
(function () {
  const modal = document.getElementById("uiModal");
  const card = document.getElementById("uiModalCard");
  const titleEl = document.getElementById("uiModalTitle");
  const msgEl = document.getElementById("uiModalMsg");
  const bodyEl = document.getElementById("uiModalBody");
  const errEl = document.getElementById("uiModalError");
  const iconEl = document.getElementById("uiModalIcon");
  const cancelBtn = document.getElementById("uiModalCancel");
  const confirmBtn = document.getElementById("uiModalConfirm");
  let resolver = null;

  function open() {
    modal.classList.remove("hidden");
    modal.classList.add("flex");
    requestAnimationFrame(() => { card.style.transform = "scale(1)"; card.style.opacity = "1"; });
  }
  function close(result) {
    card.style.transform = "scale(.96)"; card.style.opacity = "0";
    setTimeout(() => { modal.classList.add("hidden"); modal.classList.remove("flex"); }, 130);
    const r = resolver; resolver = null;
    if (r) r(result);
  }
  function showError(t) { errEl.textContent = t; errEl.classList.remove("hidden"); }

  cancelBtn.onclick = () => close(null);
  modal.onclick = () => close(null);
  document.addEventListener("keydown", (e) => {
    if (modal.classList.contains("hidden")) return;
    if (e.key === "Escape") close(null);
    if (e.key === "Enter" && document.activeElement.tagName !== "TEXTAREA") confirmBtn.click();
  });

  // uiForm({ title, message?, fields:[{name,label,type,value,placeholder,options,required}], confirmText? })
  window.uiForm = function (opts) {
    return new Promise((resolve) => {
      resolver = resolve;
      iconEl.classList.add("hidden");
      titleEl.textContent = opts.title || "";
      if (opts.message) { msgEl.textContent = opts.message; msgEl.classList.remove("hidden"); }
      else msgEl.classList.add("hidden");
      errEl.classList.add("hidden");
      confirmBtn.textContent = opts.confirmText || "Save";
      confirmBtn.className = "rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-700";
      bodyEl.innerHTML = "";
      bodyEl.classList.remove("hidden");
      const inputs = {};
      (opts.fields || []).forEach((f) => {
        const wrap = document.createElement("div");
        const lbl = document.createElement("label");
        lbl.className = "lm-label"; lbl.textContent = f.label || f.name;
        wrap.appendChild(lbl);
        let inp;
        if (f.type === "select") {
          inp = document.createElement("select");
          inp.className = "lm-inp";
          (f.options || []).forEach((o) => {
            const opt = document.createElement("option");
            opt.value = typeof o === "string" ? o : o.value;
            opt.textContent = typeof o === "string" ? o : o.label;
            if ((f.value || "") === opt.value) opt.selected = true;
            inp.appendChild(opt);
          });
        } else {
          inp = document.createElement("input");
          inp.className = "lm-inp"; inp.type = "text";
          inp.value = f.value || ""; inp.placeholder = f.placeholder || "";
        }
        inp.dataset.name = f.name; inp.dataset.required = f.required ? "1" : "";
        wrap.appendChild(inp); bodyEl.appendChild(wrap); inputs[f.name] = inp;
      });
      confirmBtn.onclick = () => {
        const out = {};
        for (const [name, inp] of Object.entries(inputs)) {
          const v = inp.value.trim();
          if (inp.dataset.required && !v) { showError(`${(opts.fields.find(f=>f.name===name).label)||name} is required.`); inp.focus(); return; }
          out[name] = v;
        }
        close(out);
      };
      open();
      const first = bodyEl.querySelector("input,select");
      if (first) setTimeout(() => first.focus(), 60);
    });
  };

  // uiPrompt(title, { label, value, placeholder, confirmText }) -> string | null
  window.uiPrompt = async function (title, o = {}) {
    const res = await uiForm({
      title,
      fields: [{ name: "value", label: o.label || "Name", value: o.value || "", placeholder: o.placeholder || "", required: true }],
      confirmText: o.confirmText || "Save",
    });
    return res ? res.value : null;
  };

  // uiConfirm(title, message, { confirmText, danger }) -> bool
  window.uiConfirm = function (title, message, o = {}) {
    return new Promise((resolve) => {
      resolver = resolve;
      bodyEl.innerHTML = ""; bodyEl.classList.add("hidden");
      errEl.classList.add("hidden");
      titleEl.textContent = title;
      msgEl.textContent = message || ""; msgEl.classList.remove("hidden");
      const danger = o.danger !== false;
      iconEl.className = "flex h-10 w-10 flex-shrink-0 items-center justify-center rounded-full " + (danger ? "bg-red-50 text-red-500" : "bg-indigo-50 text-indigo-600");
      iconEl.innerHTML = `<i data-lucide="${danger ? 'alert-triangle' : 'help-circle'}" class="h-5 w-5"></i>`;
      confirmBtn.textContent = o.confirmText || (danger ? "Delete" : "Confirm");
      confirmBtn.className = "rounded-lg px-4 py-2 text-sm font-semibold text-white " + (danger ? "bg-red-600 hover:bg-red-700" : "bg-indigo-600 hover:bg-indigo-700");
      confirmBtn.onclick = () => close(true);
      open();
      lucide.createIcons();
      setTimeout(() => confirmBtn.focus(), 60);
    });
  };
})();
</script>
