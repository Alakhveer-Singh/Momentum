<div class="mb-6">
  <div class="mb-2 flex items-center gap-2">
    <div class="flex flex-col gap-0.5"><span class="h-1 w-5 rounded bg-slate-400"></span><span class="h-1 w-5 rounded bg-slate-400"></span><span class="h-1 w-3 rounded bg-slate-400"></span></div>
    <span class="text-sm font-semibold text-slate-600">{{ label }}</span>
  </div>
  {% for s in rows %}
  <div class="flex items-center gap-3 border-b border-slate-100 py-3 pl-2 text-sm text-slate-700">
    <span class="h-4 w-4"></span>
    <span class="inline-block h-2.5 w-2.5 rounded-full" style="background: {{ s.color }}"></span>
    {{ s.name }}
  </div>
  {% endfor %}
</div>
