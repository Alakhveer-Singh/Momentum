{% extends "base.html" %}
{% block content %}
<div class="mx-auto max-w-2xl space-y-8">
  <div class="mb-6">
    <h1 class="text-xl font-bold">Source Master</h1>
    <p class="mt-1 text-sm text-slate-500">Manage lead sources to categorize where your leads come from.</p>
  </div>

  <div class="rounded-lg border border-slate-200 bg-white p-4">
    <div class="mb-4 flex items-center justify-between">
      <h2 class="font-semibold text-slate-900">Sources</h2>
      <button onclick="addSource()" class="inline-flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-sm text-indigo-600 hover:bg-indigo-50"><i data-lucide="plus" class="h-4 w-4"></i> Add Source</button>
    </div>

    <div id="sourcesList" class="space-y-2">
      {% for source in sources %}
      <div class="source-row flex items-center gap-3 rounded-lg border border-slate-100 bg-slate-50 p-3 text-sm" data-id="{{ source.id }}">
        <span class="inline-block h-2.5 w-2.5 shrink-0 rounded-full bg-indigo-600"></span>
        <span class="name flex-1 font-medium text-slate-900">{{ source.label }}</span>
        <span class="text-xs text-slate-400">{{ source.slug }}</span>
        <div class="flex items-center gap-1">
          <button onclick="renameSource({{ source.id }}, this)" class="rounded p-1 text-slate-400 hover:bg-white hover:text-slate-600"><i data-lucide="pencil" class="h-3.5 w-3.5"></i></button>
          <button onclick="deleteSource({{ source.id }}, '{{ source.label|escapejs }}')" class="rounded p-1 text-slate-400 hover:bg-red-50 hover:text-red-500"><i data-lucide="trash-2" class="h-3.5 w-3.5"></i></button>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</div>
{% endblock %}
{% block page_js %}
<script>
  async function renameSource(id, btn) {
    const row = btn.closest(".source-row");
    const nameSpan = row.querySelector(".name");
    const newLabel = prompt("Rename source:", nameSpan.textContent.trim());
    if (!newLabel || newLabel.trim() === nameSpan.textContent.trim()) return;
    try {
      const res = await api(`sources/${id}`, { method: "PATCH", body: { label: newLabel.trim() } });
      nameSpan.textContent = res.label;
    } catch (err) { alert(err.data?.detail || "Rename failed."); }
  }

  async function deleteSource(id, label) {
    if (!confirm(`Delete source "${label}"? Leads with this source will keep the slug but it won't appear in dropdowns.`)) return;
    try {
      await api(`sources/${id}/delete`, { method: "DELETE" });
      document.querySelector(`.source-row[data-id="${id}"]`)?.remove();
    } catch (err) { alert(err.data?.detail || "Delete failed."); }
  }

  async function addSource() {
    const label = prompt("New source name:");
    if (!label || !label.trim()) return;
    try {
      const res = await api("sources/create", { method: "POST", body: { label: label.trim() } });
      const list = document.getElementById("sourcesList");
      const div = document.createElement("div");
      div.className = "source-row flex items-center gap-3 rounded-lg border border-slate-100 bg-slate-50 p-3 text-sm";
      div.dataset.id = res.id;
      div.innerHTML = `
        <span class="inline-block h-2.5 w-2.5 shrink-0 rounded-full bg-indigo-600"></span>
        <span class="name flex-1 font-medium text-slate-900">${res.label}</span>
        <span class="text-xs text-slate-400">${res.slug}</span>
        <div class="flex items-center gap-1">
          <button onclick="renameSource(${res.id}, this)" class="rounded p-1 text-slate-400 hover:bg-white hover:text-slate-600"><i data-lucide="pencil" class="h-3.5 w-3.5"></i></button>
          <button onclick="deleteSource(${res.id}, '${res.label.replace(/'/g, "\\'")}')" class="rounded p-1 text-slate-400 hover:bg-red-50 hover:text-red-500"><i data-lucide="trash-2" class="h-3.5 w-3.5"></i></button>
        </div>`;
      list.appendChild(div);
      lucide.createIcons();
    } catch (err) { alert(err.data?.detail || "Failed to add source."); }
  }
</script>
{% endblock %}
