{% extends "base.html" %}
{% block content %}
<div class="max-w-xl space-y-2">
  <div class="mb-6">
    <h1 class="text-xl font-bold">Source Master</h1>
    <p class="mt-1 text-sm text-slate-500">Manage lead sources to categorize where your leads come from.</p>
  </div>

  <div class="mb-6">
    <div class="mb-2 flex items-center gap-2">
      <div class="flex flex-col gap-0.5"><span class="h-1 w-5 rounded bg-slate-400"></span><span class="h-1 w-5 rounded bg-slate-400"></span><span class="h-1 w-3 rounded bg-slate-400"></span></div>
      <span class="text-sm font-semibold text-slate-600">Sources</span>
    </div>
    <div id="sourcesList">
      {% for source in sources %}
      <div class="source-row flex items-center gap-3 border-b border-slate-100 py-3 text-sm" draggable="true" data-id="{{ source.id }}">
        <i data-lucide="grip-vertical" class="h-4 w-4 shrink-0 cursor-grab text-slate-300"></i>
        <button type="button" class="color-dot" style="background:{{ source.color }};" data-color="{{ source.color }}" title="Change color" onclick="event.stopPropagation(); openColorPicker(this, this.dataset.color, (c) => setSourceColor({{ source.id }}, c, this))"></button>
        <span class="name flex-1 text-slate-900">{{ source.label }}</span>
        <div class="flex items-center gap-1">
          <button onclick="renameSource({{ source.id }}, this)" class="rounded p-1 text-slate-400 hover:bg-slate-100"><i data-lucide="pencil" class="h-3.5 w-3.5"></i></button>
          <button onclick="deleteSource({{ source.id }}, '{{ source.label|escapejs }}')" class="rounded p-1 text-slate-400 hover:bg-red-50 hover:text-red-500"><i data-lucide="x" class="h-3.5 w-3.5"></i></button>
        </div>
      </div>
      {% endfor %}
    </div>
    <button onclick="addSource()" class="mt-2 inline-flex items-center gap-1.5 rounded-lg px-3 py-2 text-sm text-slate-900 hover:bg-slate-100"><i data-lucide="plus" class="h-4 w-4"></i> Add source</button>
  </div>
</div>
{% endblock %}
{% block page_js %}
<script>
  async function renameSource(id, btn) {
    const row = btn.closest(".source-row");
    const span = row.querySelector(".name");
    const name = await uiPrompt("Rename source", { label: "Source name", value: span.textContent.trim() });
    if (!name || name === span.textContent.trim()) return;
    try {
      const res = await api(`sources/${id}`, { method: "PATCH", body: { label: name } });
      span.textContent = res.label;
    } catch (err) { uiAlert(err.data?.detail || "Rename failed.", { type: "error" }); }
  }

  async function setSourceColor(id, color, dot) {
    dot.style.background = color;
    dot.dataset.color = color;
    try {
      await api(`sources/${id}`, { method: "PATCH", body: { color } });
    } catch (err) { uiAlert(err.data?.detail || "Could not update color.", { type: "error" }); }
  }

  async function deleteSource(id, label) {
    if (!await uiConfirm("Delete source", `"${label}" will be removed. This cannot be undone.`)) return;
    try {
      await api(`sources/${id}/delete`, { method: "DELETE" });
      location.reload();
    } catch (err) { uiAlert(err.data?.detail || "Delete failed.", { type: "error" }); }
  }

  async function addSource() {
    const name = await uiPrompt("Add source", { label: "Source name", placeholder: "e.g. Webinar" });
    if (!name) return;
    try {
      await api("sources/create", { method: "POST", body: { label: name } });
      location.reload();
    } catch (err) { uiAlert(err.data?.detail || "Failed to add source.", { type: "error" }); }
  }

  // Drag reorder
  let dragId = null;
  const list = document.getElementById("sourcesList");
  list.querySelectorAll(".source-row").forEach((row) => {
    row.addEventListener("dragstart", () => { dragId = row.dataset.id; row.classList.add("opacity-40"); });
    row.addEventListener("dragend", () => row.classList.remove("opacity-40"));
    row.addEventListener("dragover", (e) => e.preventDefault());
    row.addEventListener("drop", async () => {
      const dragging = list.querySelector(`.source-row[data-id="${dragId}"]`);
      if (!dragging || dragging === row) return;
      list.insertBefore(dragging, row);
      const ids = [...list.querySelectorAll(".source-row")].map((r) => Number(r.dataset.id));
      await api("sources/reorder", { method: "POST", body: { ids } });
      dragId = null;
    });
  });
</script>
{% endblock %}
