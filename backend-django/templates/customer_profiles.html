{% extends "base.html" %}
{% block content %}
<div class="mx-auto max-w-xl space-y-2">
  <div class="mb-6">
    <a href="/masters" class="inline-flex items-center gap-1 text-sm text-indigo-600 hover:underline"><i data-lucide="arrow-left" class="h-4 w-4"></i> SuperAdmin Masters</a>
    <h1 class="mt-1 text-xl font-bold">Customer Profile Master</h1>
    <p class="mt-1 text-sm text-slate-500">Manage the profile options a lead can be tagged with.</p>
  </div>

  <div class="mb-6">
    <div class="mb-2 flex items-center gap-2">
      <div class="flex flex-col gap-0.5"><span class="h-1 w-5 rounded bg-slate-400"></span><span class="h-1 w-5 rounded bg-slate-400"></span><span class="h-1 w-3 rounded bg-slate-400"></span></div>
      <span class="text-sm font-semibold text-slate-600">Profiles</span>
    </div>
    <div id="profilesList">
      {% for p in profiles %}
      <div class="profile-row flex items-center gap-3 border-b border-slate-100 py-3 text-sm" draggable="true" data-id="{{ p.id }}">
        <i data-lucide="grip-vertical" class="h-4 w-4 shrink-0 cursor-grab text-slate-300"></i>
        <span class="inline-block h-2.5 w-2.5 shrink-0 rounded-full bg-indigo-600"></span>
        <span class="name flex-1 text-indigo-600">{{ p.name }}</span>
        {% if not p.is_active %}<span class="rounded-full bg-slate-100 px-2 py-0.5 text-xs text-slate-500">Inactive</span>{% endif %}
        <div class="flex items-center gap-1">
          <button onclick="renameProfile({{ p.id }}, this)" class="rounded p-1 text-slate-400 hover:bg-slate-100"><i data-lucide="pencil" class="h-3.5 w-3.5"></i></button>
          <button onclick="deleteProfile({{ p.id }}, '{{ p.name|escapejs }}')" class="rounded p-1 text-slate-400 hover:bg-red-50 hover:text-red-500"><i data-lucide="x" class="h-3.5 w-3.5"></i></button>
        </div>
      </div>
      {% endfor %}
    </div>
    <button onclick="addProfile()" class="mt-2 inline-flex items-center gap-1.5 rounded-lg px-3 py-2 text-sm text-indigo-600 hover:bg-indigo-50"><i data-lucide="plus" class="h-4 w-4"></i> Add profile</button>
  </div>
</div>
{% endblock %}
{% block page_js %}
<script>
  async function renameProfile(id, btn) {
    const row = btn.closest(".profile-row");
    const span = row.querySelector(".name");
    const name = prompt("Rename profile", span.textContent.trim());
    if (!name || name.trim() === span.textContent.trim()) return;
    try {
      const res = await api(`profiles/${id}`, { method: "PATCH", body: { name: name.trim() } });
      span.textContent = res.name;
    } catch (err) { alert(err.data?.detail || "Rename failed."); }
  }

  async function deleteProfile(id, name) {
    if (!confirm(`Delete profile "${name}"?`)) return;
    try {
      await api(`profiles/${id}/delete`, { method: "DELETE" });
      location.reload();
    } catch (err) { alert(err.data?.detail || "Delete failed."); }
  }

  async function addProfile() {
    const name = prompt("New profile name");
    if (!name || !name.trim()) return;
    try {
      await api("profiles/create", { method: "POST", body: { name: name.trim() } });
      location.reload();
    } catch (err) { alert(err.data?.detail || "Failed to add profile."); }
  }

  // Drag reorder
  let dragId = null;
  const list = document.getElementById("profilesList");
  list.querySelectorAll(".profile-row").forEach((row) => {
    row.addEventListener("dragstart", () => { dragId = row.dataset.id; row.classList.add("opacity-40"); });
    row.addEventListener("dragend", () => row.classList.remove("opacity-40"));
    row.addEventListener("dragover", (e) => e.preventDefault());
    row.addEventListener("drop", async () => {
      const dragging = list.querySelector(`.profile-row[data-id="${dragId}"]`);
      if (!dragging || dragging === row) return;
      list.insertBefore(dragging, row);
      const ids = [...list.querySelectorAll(".profile-row")].map((r) => Number(r.dataset.id));
      await api("profiles/reorder", { method: "POST", body: { ids } });
      dragId = null;
    });
  });
</script>
{% endblock %}
