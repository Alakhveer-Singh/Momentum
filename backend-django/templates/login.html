{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in · Quibus LMS</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900">
<div class="flex min-h-screen items-center justify-center p-4">
  <div class="w-full max-w-md rounded-2xl bg-white p-8 shadow-2xl">
    <div class="mb-6 text-center">
      <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-indigo-600">
        <i data-lucide="target" class="h-8 w-8 text-white"></i>
      </div>
      <h1 class="mt-3 text-2xl font-bold">Quibus LMS</h1>
      <p class="text-sm text-slate-500">Sign in to your workspace</p>
    </div>
    <form method="post" action="/login" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="mb-1 block text-sm font-medium">Email</label>
        <input type="email" name="email" value="{{ email|default:'admin@quibus.in' }}" required
               class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-indigo-500 focus:outline-none" />
      </div>
      <div>
        <label class="mb-1 block text-sm font-medium">Password</label>
        <input type="password" name="password" value="password" required
               class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-indigo-500 focus:outline-none" />
      </div>
      {% if error %}<div class="rounded-lg bg-red-50 px-3 py-2 text-sm text-red-600">{{ error }}</div>{% endif %}
      <button class="w-full rounded-lg bg-indigo-600 py-2.5 font-semibold text-white hover:bg-indigo-700">Sign in</button>
    </form>
  </div>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
