{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in with phone · Momentum</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}" />
  <script src="https://unpkg.com/lucide@latest"></script>
  {% include "partials/auth_styles.html" %}
</head>
<body>
<div class="stage">
<div class="split">
  <div class="pane pane-left">
    {% include "partials/auth_hero.html" %}
  </div>

  <div class="pane pane-right">
    <div class="topbar">
      <div class="brand">
        <img src="{% static 'img/momentum-logo-dark.png' %}" alt="Momentum" style="height:34px;width:auto;" />
        <span class="brand-name">Momentum</span>
      </div>
    </div>

    <div class="form-wrap">
      <h1 class="title">Sign in with phone</h1>
      <p class="subtitle">We'll text you a one-time code.</p>
      <form method="post" action="/login/phone">
        {% csrf_token %}
        <div class="field">
          <label>Phone number</label>
          <input type="tel" name="phone" value="{{ phone|default:'' }}" placeholder="+91 98765 43210" required autofocus />
        </div>
        {% if error %}<div class="alert">{{ error }}</div>{% endif %}
        <button type="submit" class="btn-login"><i data-lucide="smartphone" style="height:18px;width:18px"></i> Send code</button>
      </form>
      <p class="muted-link"><a href="/login">Back to sign in</a></p>
    </div>

    <div class="legal">
      <span>&copy; 2020-2026 Momentum</span>
      <div><a href="mailto:momentum0team@gmail.com">Contact Us</a></div>
    </div>
  </div>
</div>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
